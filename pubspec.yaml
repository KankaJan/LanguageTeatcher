name: language_teatcher
description: "Voice-only English vocabulary trainer for a Czech-speaking toddler."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.0
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.0
  just_audio: ^0.10.0
  path_provider: ^2.1.0
  record: ^6.0.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - content/vocabulary.json
    - assets/openmoji/
