name: CI

# Every branch and pull request: static analysis, unit tests, and a
# debug-signed release APK as a downloadable artifact for testing on a phone.
# Publishing (tags, GitHub Releases, Play) lives in release.yml and runs only
# on master.

on:
  push:
    branches-ignore: ['master']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Signed with the committed debug key (android/app/debug.keystore):
      # installs over any other debug-signed build of the app.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: otterly-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
